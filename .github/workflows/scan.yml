name: Daily scan
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas yfinance lxml
      - run: python scan.py
      - name: Save results
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data/scan.json data/scan_history.json
          git commit -m "Daily scan" || echo "nothing to save"
          git pull --rebase
          git push
